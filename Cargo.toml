[workspace]
members = ["apps/converter"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
arrow-array = "59.3.0"
arrow-schema = "59.3.0"
clap = { version = "4.5", features = ["derive"] }
las = { version = "0.11.1", features = ["laz-parallel"] }
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
