<!doctype html><html lang="ja"><meta charset="UTF-8"><title>Browser point cloud benchmark</title>
<style>body{font:16px system-ui;max-width:1000px;margin:40px auto;padding:20px}pre{white-space:pre-wrap}button{padding:12px}textarea{width:100%;height:220px}</style>
<h1>ブラウザ内の読み取り・展開ベンチマーク</h1>
<p>点群を事前取得し、Worker内のメモリから読み取り。通信・描画・デコーダー初期起動は計測外。各queryで新しいリーダーを作成し、openからXYZRGB配列生成完了までを測定。</p>
<button id="run">比較を実行（warmup 1回・計測5回）</button>
<pre id="status">待機中</pre><h2>結果</h2><pre id="summary"></pre>
<a id="download" hidden>測定JSONを保存</a><textarea aria-label="測定JSON" id="result" readonly></textarea>
<script type="module" src="./main.js"></script></html>
