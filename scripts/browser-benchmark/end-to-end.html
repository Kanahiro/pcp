<!doctype html><html lang="ja"><meta charset="UTF-8"><title>通信から描画までの点群比較</title>
<style>body{font:16px system-ui;margin:24px}label{display:block;margin:10px 0}input{width:620px}canvas{width:960px;height:540px}pre{white-space:pre-wrap}textarea{width:95%;height:120px}</style>
<h1>通信から描画までの点群比較</h1>
<p>実ブラウザのfetch・Worker・ビューア共通の色変換と点描画。各試行は新しいWorkerとWebGLコンテキストを使用。点群データのHTTPキャッシュは無効。</p>
<label>Parquet URL <input id="parquet" value="http://127.0.0.1:18080/114112.parquet"></label>
<label>COPC URL <input id="copc" value="http://127.0.0.1:18080/114112.copc.laz"></label>
<button id="run">全区間を測定（warmup 1回・計測3回）</button>
<pre id="status">待機中</pre><div id="viewport"></div><pre id="summary"></pre>
<a id="download" hidden>測定JSONを保存</a><textarea id="result" aria-label="測定JSON" readonly></textarea>
<script type="module" src="./end-to-end.js"></script></html>
