packages:
  - apps/viewer
  - packages/*

# Vite requires esbuild's platform-binary installer; no other dependency may run builds.
allowBuilds:
  esbuild: true

# pnpm expresses this supply-chain cooling period in minutes: 7 days.
minimumReleaseAge: 10080

# Upstream INT32 delta fix #180 first shipped in 1.31.2. Remove this exception
# after its seven-day cooling period ends on 2026-10-04 UTC.
minimumReleaseAgeExclude:
  - hyparquet@1.31.2
